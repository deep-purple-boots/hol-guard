name: CodeQL

on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Provide legacy workspace alias for CodeQL default setup state
        run: |
          LEGACY_ROOT="/home/runner/work/codex-plugin-scanner"
          mkdir -p "$LEGACY_ROOT"
          ln -sfn "$GITHUB_WORKSPACE" "$LEGACY_ROOT/codex-plugin-scanner"
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: .
          config: |
            paths-ignore:
              - src/codex_plugin_scanner/guard/stable_digest.py
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          category: /language:${{ matrix.language }}
